[project]
name = "mflux-server"
version = "0.1.0"
description = "Local server exposing mflux behind an OpenAI-Images-compatible API"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "mflux==0.18.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.20",
    "pydantic>=2.10",
    "pillow>=12.1.1",
]

[project.scripts]
mflux-server = "mflux_server.app:main"
mflux-server-prequantize = "mflux_server.prequantize:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mflux_server"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
