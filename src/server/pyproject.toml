[project]
name = "qds"
version = "2.2.0"
description = "Quantum Diffusion Server: a local, OpenAI-Images-compatible image generation server for Apple Silicon"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "mflux==0.19.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.20",
    "pydantic>=2.10",
    "pillow>=12.1.1",
    # The prompt rewriter's decoder. A plain runtime dependency, and it was an
    # optional extra first -- the argument for that was that a feature shipping
    # switched off should not make everyone carry its dependency. Measured, that
    # argument was wrong twice over.
    #
    # It costs one package: every transitive dependency mlx-lm has (transformers,
    # numpy, huggingface-hub, jinja2, protobuf, sentencepiece) already arrives
    # with mflux, so resolving the two together adds mlx-lm and nothing else.
    #
    # And an extra cannot be installed by the app at all. `uv tool install
    # <wheel>` is the whole installation, so the dependency has to be *in* the
    # wheel's metadata or it never arrives -- leaving a user who pressed Enhance
    # with "run `uv sync --extra rewrite`", a command that means nothing outside
    # a checkout they do not have. Python and mflux install themselves; this had
    # to as well.
    "mlx-lm>=0.31.3",
    # The MCP surface's SDK. A hard dependency for half of mlx-lm's reasoning
    # above -- `uv tool install <wheel>` is the whole installation, so an extra
    # never arrives -- but *not* for the other half, and that difference is
    # worth writing down rather than discovering later: mlx-lm cost one package,
    # while this one brings cryptography, opentelemetry-api, jsonschema, httpx2,
    # sse-starlette and mcp-types with it.
    #
    # Pinned `==`, like mflux: this SDK renamed its primary class between majors
    # and changed what a cancelled request returns, and both are things QDS
    # depends on. The next bump should be a deliberate act, not a resolution.
    "mcp==2.0.0",
]

[project.urls]
Homepage = "https://github.com/exalandru/Quantum-Diffusion-Server"
Repository = "https://github.com/exalandru/Quantum-Diffusion-Server"
Issues = "https://github.com/exalandru/Quantum-Diffusion-Server/issues"

[project.scripts]
qds = "qds.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "httpx>=0.28",
    "ruff>=0.9",
    # Reference implementations, for `tests/test_anima.py` only. QDS ships an MLX
    # port of Anima's DiT and text adapter; these are what the port is checked
    # against, tensor for tensor, so they are a test dependency and never a
    # runtime one — the server never imports diffusers. torchvision comes with
    # them because the Cosmos reference resizes its padding mask through it.
    "diffusers==0.39.0",
    "torchvision>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qds"]

# The built dashboard is package data: `uv tool install qds` gets a server that
# already has its own interface, with no second artifact to fetch. `artifacts`
# rather than a plain glob because the build output is gitignored, and hatchling
# excludes what version control ignores — in the sdist too, so a wheel built
# *from the sdist* is not silently missing an interface the one built from the
# checkout had.
artifacts = ["qds/_dashboard/**"]

[tool.hatch.build.targets.sdist]
artifacts = ["qds/_dashboard/**"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The job manager is asyncio all the way down; its tests drive a real event loop
# rather than a `TestClient` thread, so they need the plugin's fixtures.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
