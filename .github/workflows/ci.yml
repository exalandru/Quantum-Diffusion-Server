name: CI

# Static gates for the server, plus the full dashboard and menubar suites.
#
# The server suite is NOT run here, deliberately. It exercises MLX, which needs
# a Metal device: there is no Linux build (no `libmlx.so`, so `ubuntu-latest`
# fails at import), and the virtualised macOS runners expose no GPU, where
# `import mlx.core` hangs rather than failing (ml-explore/mlx#3148). Running it
# here stalls the job until it times out. The suite is run on a dev machine,
# where Metal is available: `make test`. CI keeps the server honest with ruff.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Ruff
        run: uvx ruff check src/server

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix src/dashboard
      - name: Typecheck
        run: npm --prefix src/dashboard run typecheck
      - name: Vitest
        run: npm --prefix src/dashboard test

  menubar:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift test
        run: swift test --package-path src/menubar
